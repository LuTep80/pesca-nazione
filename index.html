<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesca la nazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: una sola scheda, codice personale e parola segreta */
  --bg:#e9efe9; --paper:#fbfcfa; --ink:#14251c; --muted:#53655a; --line:#cbd8ce;
  --pine:#1f4d36; --berry:#b3262e; --berry-ink:#ffffff; --gold:#b98a1d;
  --font-display:'Fraunces',Georgia,serif; --font-body:'DM Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a14; --paper:#17261d; --ink:#e8f0ea; --muted:#9bb0a2; --line:#2b4034;
    --pine:#7fc29b; --berry:#e0525a; --berry-ink:#1a0a0b; --gold:#e0b84e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a14; --paper:#17261d; --ink:#e8f0ea; --muted:#9bb0a2; --line:#2b4034;
  --pine:#7fc29b; --berry:#e0525a; --berry-ink:#1a0a0b; --gold:#e0b84e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--font-body);min-height:100%;padding:24px 16px 56px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:800 clamp(2rem,7vw,3rem)/1.05 var(--font-display);margin:0;color:var(--pine);text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
label{font-weight:700;font-size:.95rem}
.hint{color:var(--muted);font-size:.9rem}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{resize:vertical;min-height:84px;word-break:break-all}
input{min-height:48px}
button{font:700 1rem var(--font-body);border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:12px 16px;cursor:pointer;min-height:48px}
button:hover{border-color:var(--pine)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--berry);border-color:var(--berry);color:var(--berry-ink)}
button.primary:hover{filter:brightness(1.08)}
.err{color:var(--berry);font-weight:700;min-height:1.4em}
.row{display:flex;flex-wrap:wrap;gap:10px}
.hidden{display:none}
.reveal{border:2px dashed var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.reveal .nation{font:800 clamp(1.8rem,8vw,2.6rem)/1.1 var(--font-display);color:var(--berry)}
.who{font:800 1.8rem/1.1 var(--font-display);color:var(--pine)}
.k{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s,border-color .15s}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Pesca la nazione</h1>
    <p class="lead">Incolla il codice personale che hai ricevuto e scopri la tua nazione. Il risultato è fisso: lo stesso codice dà sempre la stessa nazione, su qualsiasi dispositivo.</p>
  </header>

  <section class="card">
    <div>
      <label for="code">Il tuo codice</label>
      <textarea id="code" autocomplete="off" spellcheck="false" placeholder="SS3-..."></textarea>
    </div>
    <button id="draw" class="primary" type="button">Scopri la mia nazione</button>
    <p id="perr" class="err" role="alert"></p>

    <div id="rev" class="reveal hidden" aria-live="polite">
      <p class="k" id="rev-for"></p>
      <p class="k">Nazione estratta</p>
      <p class="nation" id="rev-nation"></p>
      <div class="row"><button id="hide" type="button">Nascondi</button></div>
    </div>
  </section>
</main>

<script>
const COUNTRIES = ["Afghanistan","Albania","Algeria","Andorra","Angola","Antigua e Barbuda","Arabia Saudita","Argentina","Armenia","Australia","Austria","Azerbaigian","Bahamas","Bahrein","Bangladesh","Barbados","Belgio","Belize","Benin","Bhutan","Bielorussia","Bolivia","Bosnia ed Erzegovina","Botswana","Brasile","Brunei","Bulgaria","Burkina Faso","Burundi","Cambogia","Camerun","Canada","Capo Verde","Ciad","Cile","Cina","Cipro","Colombia","Comore","Corea del Nord","Corea del Sud","Costa d'Avorio","Costa Rica","Croazia","Cuba","Danimarca","Dominica","Ecuador","Egitto","El Salvador","Emirati Arabi Uniti","Eritrea","Estonia","Eswatini","Etiopia","Figi","Filippine","Finlandia","Francia","Gabon","Gambia","Georgia","Germania","Ghana","Giamaica","Giappone","Gibuti","Giordania","Grecia","Grenada","Guatemala","Guinea","Guinea-Bissau","Guinea Equatoriale","Guyana","Haiti","Honduras","India","Indonesia","Iran","Iraq","Irlanda","Islanda","Isole Marshall","Isole Salomone","Israele","Italia","Kazakistan","Kenya","Kirghizistan","Kiribati","Kuwait","Laos","Lesotho","Lettonia","Libano","Liberia","Libia","Liechtenstein","Lituania","Lussemburgo","Macedonia del Nord","Madagascar","Malawi","Maldive","Malesia","Mali","Malta","Marocco","Mauritania","Mauritius","Messico","Micronesia","Moldavia","Monaco","Mongolia","Montenegro","Mozambico","Myanmar","Namibia","Nauru","Nepal","Nicaragua","Niger","Nigeria","Norvegia","Nuova Zelanda","Oman","Paesi Bassi","Pakistan","Palau","Panama","Papua Nuova Guinea","Paraguay","Perù","Polonia","Portogallo","Qatar","Regno Unito","Repubblica Ceca","Repubblica Centrafricana","Repubblica del Congo","Repubblica Democratica del Congo","Repubblica Dominicana","Romania","Ruanda","Russia","Saint Kitts e Nevis","Saint Lucia","Saint Vincent e Grenadine","Samoa","San Marino","São Tomé e Príncipe","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Siria","Slovacchia","Slovenia","Somalia","Spagna","Sri Lanka","Stati Uniti","Sudafrica","Sudan","Sudan del Sud","Suriname","Svezia","Svizzera","Tagikistan","Tailandia","Tanzania","Timor Est","Togo","Tonga","Trinidad e Tobago","Tunisia","Turchia","Turkmenistan","Tuvalu","Ucraina","Uganda","Ungheria","Uruguay","Uzbekistan","Vanuatu","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];
const $ = id => document.getElementById(id);
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

function hash(str){ // cyrb53
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function check(body){ let h = 0; for (const v of body) h = (h * 31 + v + 1) % 65521; return h; }
function decode(s){
  s = s.replace(/\s+/g, '');
  if (!s.startsWith('SS3-')) throw 0;
  let b = s.slice(4).replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  const u = Uint8Array.from(atob(b), c => c.charCodeAt(0));
  if (u.length < 5) throw 0;
  const body = u.slice(0, u.length - 2), chk = (u[u.length - 2] << 8) | u[u.length - 1];
  if (check(body) !== chk) throw 0;
  const nl = body[0];
  if (!nl || body.length !== nl + 2) throw 0;
  const name = new TextDecoder().decode(body.slice(1, 1 + nl));
  const idx = body[1 + nl] ^ (hash(name) & 255);
  if (idx >= COUNTRIES.length) throw 0;
  return { name, country: COUNTRIES[idx] };
}
function hideRev(){ $('rev').classList.add('hidden'); $('rev-nation').textContent = ''; $('rev-for').textContent = ''; }
$('draw').addEventListener('click', () => {
  const err = $('perr'); err.textContent = ''; hideRev();
  let c;
  try { c = decode($('code').value); }
  catch(e){ err.textContent = 'Codice non valido. Incollalo per intero, a partire da SS3-.'; return; }
  $('rev-for').textContent = 'Per ' + c.name;
  $('rev-nation').textContent = c.country;
  $('rev').classList.remove('hidden');
});
$('hide').addEventListener('click', hideRev);
</script>
</body>
</html>
